# Shared claim schema definitions.
#
# SINGLE SOURCE OF TRUTH for claim fields.
#
# This file is referenced by BOTH:
#   - open-api-specification.yml           (openApiNullable = false -> plain Java fields)
#   - amendment-open-api-specification.yml (openApiNullable = true  -> JsonNullable<T> fields)
#
# Every claim_base property is intentionally marked `nullable: true`.
# * Under the standard generation (openApiNullable = false) the nullable flag is
#   ignored and plain fields (e.g. `private String feeCode;`) are produced, so the
#   existing ClaimPatch / ClaimResponse / ClaimBase output is unchanged.
# * Under the amendment generation (openApiNullable = true) the nullable flag causes
#   true PATCH tri-state fields (e.g. `private JsonNullable<String> feeCode = JsonNullable.undefined();`).
claim_status:
  type: string
  enum:
    - READY_TO_PROCESS
    - VALID
    - INVALID
    - VOID
  description: |
    System-maintained processing status indicator that tracks the validation lifecycle of a
    claim record from initial submission through to final approval or rejection.

claim_base:
