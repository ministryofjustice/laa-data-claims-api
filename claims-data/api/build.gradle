plugins {
    id 'org.openapi.generator' version '7.23.0'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
}

repositories {
    mavenCentral()
}

// Dependency overrides
// example:
// Upgrade to fix CVE-xxxx-xxxxx
// ext['dependency-name.version'] = 'x.x.x'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.data:spring-data-commons'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.11'
    implementation 'org.projectlombok:lombok:1.18.38'
}

sourceSets.main.java.srcDirs += ['generated/src/main/java']
sourceSets.main.java.srcDirs += ['generated-amendment/src/main/java']

checkstyleMain.exclude "*"

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/claims-data/api/open-api-specification.yml".toString()
    outputDir = "$rootDir/claims-data/api/generated".toString()
    apiPackage = "uk.gov.justice.laa.dstew.payments.claimsdata.api"
    invokerPackage = "uk.gov.justice.laa.dstew.payments.claimsdata.invoker"
    modelPackage = "uk.gov.justice.laa.dstew.payments.claimsdata.model"
    
    // Handle custom format: bigDecimal by mapping it to BigDecimal
    // This prevents the "Unknown format" warnings
    typeMappings = [
            "number+bigDecimal": "BigDecimal"
    ]
    
    importMappings = [
            "BigDecimal": "java.math.BigDecimal"
    ]

    // ClaimAmendmentPatch is generated by the openApiGenerateAmendment task (with JsonNullable).
    // Map it here so the main task IMPORTS that class for the updateClaim operation instead of
    // generating a second (plain) copy, which would collide on the classpath.
    schemaMappings = [
            "claim_amendment_patch": "uk.gov.justice.laa.dstew.payments.claimsdata.model.ClaimAmendmentPatch"
    ]

    configOptions = [
            generateBuilders    : "true",
            interfaceOnly       : "true", // This will only generate interfaces, not implementations
            serializableModel   : "true",
            skipDefaultInterface: "true",
            useJakartaEe        : "true",
            useSpringBoot4      : "true",
            useTags             : "true",
            openApiNullable     : "false"
    ]
}

import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

tasks.register('openApiGenerateSwaggerOnly', GenerateTask) {
    generatorName = "html2"
    inputSpec = "$rootDir/claims-data/api/open-api-specification.yml"
    outputDir = layout.buildDirectory.dir("generated/swagger-ui").get().asFile.toString()
    skipValidateSpec = false
    configOptions = [
            "hideDownloadButton": "true",
            "theme": "flattop"  // or another Swagger UI theme if you prefer
    ]
}

// -----------------------------------------------------------------------------
// Amendment model generation (true PATCH tri-state semantics via JsonNullable<T>)
//
// Uses the dedicated amendment specification with `openApiNullable = true`.
// Only ClaimAmendmentPatch is written to disk (see the ignore file override);
// all shared types are supplied by the standard `openApiGenerate` task in the
// SAME package (uk.gov.justice.laa.dstew.payments.claimsdata.model), so there are
// no class or package collisions.
// -----------------------------------------------------------------------------
tasks.register('openApiGenerateAmendment', GenerateTask) {
    generatorName = "spring"
    inputSpec.set(
        layout.projectDirectory.file(
            "amendment-open-api-specification.yml"
        )
    )
    outputDir.set(
        layout.projectDirectory.dir(
            "generated-amendment"
        )
    )
    apiPackage = "uk.gov.justice.laa.dstew.payments.claimsdata.api"
    invokerPackage = "uk.gov.justice.laa.dstew.payments.claimsdata.invoker"
    modelPackage = "uk.gov.justice.laa.dstew.payments.claimsdata.model"

    // Only write ClaimAmendmentPatch.java; shared classes come from openApiGenerate.
    ignoreFileOverride.set(
        layout.projectDirectory.file(
            "openapi-generator-ignore-amendment"
        )
    )

    typeMappings = [
            "number+bigDecimal": "BigDecimal"
    ]

    importMappings = [
            "BigDecimal": "java.math.BigDecimal"
    ]

    configOptions = [
            generateBuilders    : "true",
            interfaceOnly       : "true",
            serializableModel   : "true",
            skipDefaultInterface: "true",
            useJakartaEe        : "true",
            useSpringBoot4      : "true",
            useTags             : "true",
            openApiNullable     : "true"
    ]
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'data-claims-api-models'
        }
    }
}

compileJava.dependsOn 'openApiGenerate'
compileJava.dependsOn 'openApiGenerateAmendment'

clean {
    delete "$projectDir/generated"
    delete "$projectDir/generated-amendment"
}

// disable for overall project when running a build
tasks.named('bootJar') {
    enabled = false
}

tasks.named('bootRun') {
    enabled = false
}
