# =============================================================================
# Amendment OpenAPI specification
# =============================================================================
#
# Dedicated specification used ONLY to generate the amendment PATCH model
# (claim_amendment_patch -> ClaimAmendmentPatch) with true tri-state semantics.
#
# This spec is generated by the `openApiGenerateAmendment` Gradle task with
# `openApiNullable = true`, so every nullable field becomes a JsonNullable<T>,
# allowing the amendment pipeline to distinguish:
#   * omitted        -> JsonNullable.undefined()
#   * explicit null  -> JsonNullable.of(null)
#   * populated      -> JsonNullable.of(value)
#
# It reuses the SINGLE SOURCE OF TRUTH schemas WITHOUT any circular reference:
#   * the entire claim_patch shape -> ./schemas/claim-patch.yml#/claim_patch
#     (which itself composes ./schemas/claim-base.yml plus fee_calculation_patch
#     and validation_message_patch, all owned by the shared file). This spec no
#     longer references open-api-specification.yml, so OpenAPI Generator 7.23.0
#     resolves every schema cleanly with no "Failed to get the schema name"
#     warnings.
#
# Only ClaimAmendmentPatch.java is written to disk (see the
# openapi-generator-ignore-amendment ignore file). All other referenced types
# (ClaimStatus, FeeCalculationPatch, ValidationMessagePatch, ...) are produced by
# the standard `openApiGenerate` task in the same package, so there are no class
# or package collisions.
openapi: "3.0.0"
info:
  version: 1.0.0
  title: LAA Data Claims API - Amendment Models
  description: |
    Internal specification used to generate amendment PATCH models that support
    JSON Merge Patch tri-state semantics via JsonNullable<T>.

paths: {}

components:
  schemas:
    claim_amendment_patch:
      description: |
        Amendment PATCH representation of a claim. This is the SAME shape as claim_patch (it is
        derived from the shared ./schemas/claim-patch.yml#/claim_patch via allOf, so there is a
        single source of truth for the field list and no risk of drift), but because this spec is
        generated with openApiNullable = true every nullable field becomes a JsonNullable<T>. That
        lets the amendment pipeline distinguish an omitted field from an explicit null while keeping
        the JSON wire format identical to claim_patch.
      allOf:
        - $ref: './schemas/claim-patch.yml#/claim_patch'



