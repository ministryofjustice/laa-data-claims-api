description: "CRIME LOWER submission claims export"
provider: submissionClaimsCrimeLowerProvider
packageName: uk.gov.justice.laa.dstew.payments.claimsdata.export.generated
sql: |
  select
       -- Claim identifiers
       concat_ws(' ', client.client_forename, client.client_surname)  as clientName,
       c.unique_file_number                                           as ufn,
       c.fee_code                                                     as feeCode,
       c.crime_matter_type_code                                       as crimeMatterType,
       c.representation_order_date                                    as representationOrderDate,
       claim_case.stage_reached_code                                  as stageReachedCode,
       claim_case.outcome_code                                        as outcomeCode,
       c.case_concluded_date                                          as caseConcludedDate,

       -- Reported
       case latest_calculated.escape_case_flag
           when true then 'Yes'
           when false then 'No'
       end                                as feeDetailEscapeCaseFlag,
       csf.net_profit_costs_amount        as netProfitCostsAmount,
       csf.net_disbursement_amount        as netDisbursementAmount,
       csf.disbursements_vat_amount       as disbursementsVatAmount,
       csf.travel_waiting_costs_amount    as netTravelCostsAmount,
       csf.net_waiting_costs_amount       as netWaitingCostsAmount,
       case csf.is_vat_applicable
           when true then 'Yes'
           when false then 'No'
       end                                as vatIndicator,

       -- Initial calculated
       initial_calculated.fixed_fee_amount            as initialCalculatedFixedFeeAmount,
       initial_calculated.hourly_total_amount         as initialCalculatedHourlyTotalAmount,
       initial_calculated.net_profit_costs_amount     as initialCalculatedNetProfitCostsAmount,
       initial_calculated.disbursement_amount         as initialCalculatedNetDisbursementAmount,
       initial_calculated.disbursement_vat_amount     as initialCalculatedDisbursementsVatAmount,
       initial_calculated.net_travel_costs_amount     as initialCalculatedNetTravelCostsAmount,
       initial_calculated.net_waiting_costs_amount    as initialCalculatedNetWaitingCostsAmount,

       -- Current calculated
       coalesce(latest_assessment.fixed_fee_amount,
                latest_calculated.fixed_fee_amount)           as currentCalculatedFixedFeeAmount,
       latest_calculated.hourly_total_amount                  as currentCalculatedHourlyTotalAmount,
       coalesce(latest_assessment.net_profit_costs_amount,
                latest_calculated.net_profit_costs_amount)    as currentCalculatedNetProfitCostsAmount,
       coalesce(latest_assessment.disbursement_amount,
                latest_calculated.disbursement_amount)        as currentCalculatedNetDisbursementAmount,
       coalesce(latest_assessment.disbursement_vat_amount,
                latest_calculated.disbursement_vat_amount)    as currentCalculatedDisbursementsVatAmount,
       coalesce(latest_assessment.net_travel_costs_amount,
                latest_calculated.net_travel_costs_amount)    as currentCalculatedNetTravelCostsAmount,
       coalesce(latest_assessment.net_waiting_costs_amount,
                latest_calculated.net_waiting_costs_amount)   as currentCalculatedNetWaitingCostsAmount,

       -- Total allowed values
       round(initial_calculated.total_amount::numeric, 2)                     as initialClaimValue,
       round(initial_calculated.calculated_vat_amount::numeric, 2)            as initialClaimValueVat,
       coalesce(round(latest_assessment.allowed_total_incl_vat::numeric, 2),
                round(latest_calculated.total_amount::numeric, 2))            as currentClaimValue,
       coalesce(round(latest_assessment.allowed_total_vat::numeric, 2),
                round(latest_calculated.calculated_vat_amount::numeric, 2))   as currentClaimValueVat,

       -- Status
       case
           when c.status = 'VOID' then 'Voided'
           when c.status = 'VALIDATED_PENDING_APPROVAL' then 'Not submitted'
           when c.status = 'VALID' and latest_assessment.claim_id is not null then 'Assessed'
           when c.status = 'VALID' and latest_amendment.claim_id is not null then 'Amended'
           when c.status = 'VALID' then 'Accepted'
       end                                                                   as derivedStatus,

       -- Assessment details
       case latest_assessment.assessment_outcome
           when 'PAID_IN_FULL' then 'Assessed in full'
           when 'REDUCED_STILL_ESCAPED' then 'Reduced (still escaped)'
           when 'REDUCED_TO_FIXED_FEE' then 'Reduced to fixed fee (assessed)'
           when 'NILLED' then 'Nilled'
       end                                                                  as assessmentOutcome,
       latest_assessment.created_on::date                                   as assessmentDate,

       -- Amendment details
       latest_amendment.display_label                                        as amendmentRequestedBy,
       latest_amendment.created_on::date                                     as amendmentDate,

       -- Submission details
       s.office_account_number                                               as officeAccountNumber,
       s.submission_period                                                   as submissionPeriod,
       case s.area_of_law
           when 'LEGAL_HELP' then 'Legal help'
           when 'CRIME_LOWER' then 'Crime lower'
           when 'MEDIATION' then 'Mediation'
       end                                                                   as areaOfLaw,
       s.created_on::date                                                    as submissionDate

  from claims.submission s
  join claims.claim c on c.submission_id = s.id
  left join claims.client client on client.claim_id = c.id
  left join claims.claim_case claim_case on claim_case.claim_id = c.id
  left join claims.claim_summary_fee csf on csf.claim_id = c.id
  left join lateral (
      select
          cfd.fixed_fee_amount,
          cfd.hourly_total_amount,
          cfd.net_profit_costs_amount,
          cfd.disbursement_amount,
          cfd.disbursement_vat_amount,
          cfd.net_travel_costs_amount,
          cfd.net_waiting_costs_amount,
          cfd.total_amount,
          cfd.calculated_vat_amount
      from claims.calculated_fee_detail cfd
      where cfd.claim_id = c.id
      order by cfd.created_on, cfd.id
      limit 1
      ) initial_calculated on true
  left join lateral (
      select
          cfd.fixed_fee_amount,
          cfd.hourly_total_amount,
          cfd.net_profit_costs_amount,
          cfd.disbursement_amount,
          cfd.disbursement_vat_amount,
          cfd.net_travel_costs_amount,
          cfd.net_waiting_costs_amount,
          cfd.total_amount,
          cfd.calculated_vat_amount,
          cfd.escape_case_flag
      from claims.calculated_fee_detail cfd
      where cfd.claim_id = c.id
      order by cfd.created_on desc, cfd.id desc
      limit 1
      ) latest_calculated on true
  left join lateral (
      select
          a.claim_id,
          a.assessment_outcome,
          a.created_on,
          a.fixed_fee_amount,
          a.net_profit_costs_amount,
          a.disbursement_amount,
          a.disbursement_vat_amount,
          a.net_travel_costs_amount,
          a.net_waiting_costs_amount,
          a.allowed_total_vat,
          a.allowed_total_incl_vat
      from claims.assessment a
      where a.claim_id = c.id
        and c.status <> 'VOID'
      order by a.created_on desc, a.id desc
      limit 1
      ) latest_assessment on true
  left join lateral (
      select
          am.claim_id,
          requested_by.display_label,
          am.created_on
      from claims.claim_amendment am
      join claims.requested_by_reference requested_by on requested_by.code = am.requested_by_code
      where am.claim_id = c.id
      order by am.created_on desc, am.id desc
      limit 1
      ) latest_amendment on true
  where s.id = :submissionId
    and c.status in ('VALID', 'VOID', 'VALIDATED_PENDING_APPROVAL')
    and s.office_account_number = :office
    and s.area_of_law = 'CRIME_LOWER'
  limit :maxRows
columns:
  - key: clientName
    header: Client name
  - key: ufn
    header: Unique file number (UFN)
  - key: feeCode
    header: Fee code
  - key: crimeMatterType
    header: Matter type
  - key: representationOrderDate
    header: Representation order date
  - key: stageReachedCode
    header: Stage reached
  - key: outcomeCode
    header: Outcome code
  - key: caseConcludedDate
    header: Date of work concluded
  - key: feeDetailEscapeCaseFlag
    header: Escape case?
  - key: netProfitCostsAmount
    header: Reported net profit costs
  - key: netDisbursementAmount
    header: Reported net disbursements
  - key: disbursementsVatAmount
    header: VAT on reported disbursements
  - key: netTravelCostsAmount
    header: Reported net travel costs
  - key: netWaitingCostsAmount
    header: Reported net waiting costs
  - key: vatIndicator
    header: VAT claimed?
  - key: initialCalculatedFixedFeeAmount
    header: Initial calculated fixed fee
  - key: initialCalculatedHourlyTotalAmount
    header: Initial calculated hourly rates total
  - key: initialCalculatedNetProfitCostsAmount
    header: Initial calculated net profit costs
  - key: initialCalculatedNetDisbursementAmount
    header: Initial calculated net disbursements
  - key: initialCalculatedDisbursementsVatAmount
    header: Initial calculated VAT on disbursements
  - key: initialCalculatedNetTravelCostsAmount
    header: Initial calculated net travel costs
  - key: initialCalculatedNetWaitingCostsAmount
    header: Initial calculated net waiting costs
  - key: currentCalculatedFixedFeeAmount
    header: Current calculated fixed fee
  - key: currentCalculatedHourlyTotalAmount
    header: Current calculated hourly rates total
  - key: currentCalculatedNetProfitCostsAmount
    header: Current calculated net profit costs
  - key: currentCalculatedNetDisbursementAmount
    header: Current calculated net disbursements
  - key: currentCalculatedDisbursementsVatAmount
    header: Current calculated VAT on disbursements
  - key: currentCalculatedNetTravelCostsAmount
    header: Current calculated net travel costs
  - key: currentCalculatedNetWaitingCostsAmount
    header: Current calculated net waiting costs
  - key: initialClaimValue
    header: Initial total claim value (including VAT)
  - key: initialClaimValueVat
    header: VAT on initial claim
  - key: currentClaimValue
    header: Current total claim value (including VAT)
  - key: currentClaimValueVat
    header: VAT on current claim
  - key: derivedStatus
    header: Claim status
  - key: assessmentOutcome
    header: Latest assessment outcome
  - key: assessmentDate
    header: Latest assessment date
  - key: amendmentRequestedBy
    header: Latest amendment requestor
  - key: amendmentDate
    header: Latest amendment date
  - key: officeAccountNumber
    header: Office account number
  - key: submissionPeriod
    header: Submission month
  - key: areaOfLaw
    header: Area of law
  - key: submissionDate
    header: Submission date

params:
  - name: submissionId
    requestName: submission-id
    type: UUID
    required: true
  - name: office
    type: STRING
    required: true
