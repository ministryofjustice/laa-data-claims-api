name: Snyk vulnerability report
description: >
  Waits for the Snyk Container SARIF analyses of the current run to be ingested by GitHub code scanning,
  then writes the vulnerability report (job summary and artifact) and, if the image scan failed, sends a
  Slack notification. The scripts live
  alongside this action, so it works when consumed from any repository.

inputs:
  gh_token:
    description: GitHub token that can read code scanning alerts and Actions runs of the calling repository
    required: true
  image_scan_result:
    description: Result of the image scan job (success, failure, cancelled or skipped)
    required: true
  slack_webhook:
    description: Slack incoming webhook used to notify when the image scan failed (optional)
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Code scanning alert ingestion from the Snyk SARIF upload (in the shared
    # ecr-publish-image workflow) is asynchronous. Poll rather than paying a
    # flat delay on every run - exits early once the analysis lands, capped
    # at 60s total.
    - name: Wait for Snyk SARIF processing
      id: sarif
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ github.repository }}
        REF: ${{ github.ref }}
        SHA: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: bash "$GITHUB_ACTION_PATH/wait-for-sarif.sh"

    - name: Fetch Snyk code scanning alerts
      id: alerts
      if: ${{ steps.sarif.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ github.repository }}
        ANALYSIS_IDS: ${{ steps.sarif.outputs.analysis_ids }}
      run: bash "$GITHUB_ACTION_PATH/fetch-alerts.sh"

    - name: Build vulnerability report
      if: ${{ steps.alerts.outcome == 'success' }}
      shell: bash
      env:
        IMAGE_SCAN_RESULT: ${{ inputs.image_scan_result }}
        REF: ${{ github.ref }}
        ALERT_COUNT: ${{ steps.alerts.outputs.count }}
      run: bash "$GITHUB_ACTION_PATH/build-report.sh"

    - name: Upload vulnerability report artifact
      if: ${{ steps.alerts.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: snyk-vulnerability-report
        path: |
          snyk-alerts.json
          snyk-report.md
        retention-days: 14

    # Show the three highest-severity alerts in Slack and link to the full
    # GitHub summary. JSON-escape the text for the slack-notify payload.
    - name: Build Slack summary
      id: slack_summary
      shell: bash
      env:
        IMAGE_SCAN_RESULT: ${{ inputs.image_scan_result }}
        ALERT_COUNT: ${{ steps.alerts.outputs.count }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ALERTS_OUTCOME: ${{ steps.alerts.outcome }}
      run: bash "$GITHUB_ACTION_PATH/build-slack-summary.sh"

    - name: Send Slack notification
      if: ${{ always() && inputs.image_scan_result == 'failure' && inputs.slack_webhook != '' }}
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        webhook: ${{ inputs.slack_webhook }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "Snyk container image scan for ${{ github.repository }} failed or found vulnerabilities requiring review",
            "attachments": [
              {
                "color": "#d63384",
                "text": ${{ steps.slack_summary.outputs.text || '"Vulnerability details unavailable - see workflow run"' }}
              }
            ]
          }
