name: Security Snyk dependency check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # every day at 6 AM
    - cron: '0 15 * * *' # every day at 3 PM

jobs:
  security-snyk-check:
    name: Project security Snyk dependency check
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/snyk-vulnerability-scan.yml@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
    permissions:
      contents: read
    with:
      java_version: '25'
      java_distribution: 'corretto'
      snyk_organisation: 'legal-aid-agency'
      snyk_test_exclude: ''
      snyk_target_reference: ''
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      snyk_token: ${{ secrets.SNYK_TOKEN }}

  slack-notify:
    name: Notify Slack via webhook
    needs: security-snyk-check
    if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@37ebaef184d7626c5f204ab8d3baff4262dd30f0
        with:
          payload: |
            {
              "text": "Snyk dependency scan for laa-data-claims-api: ${{ needs.security-snyk-check.result }}",
              "attachments": [
                {
                  "color": "${{ needs.security-snyk-check.result == 'success' && '#36a64f' || '#d63384' }}",
                  "text": "Workflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}