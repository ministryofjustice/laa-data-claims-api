name: Security Snyk container image check

on:
  workflow_dispatch:
  push:
    branches:
      - bug/snyk-issue-fix
  # GitHub Actions cron schedules always run in UTC, which is one hour behind
  # UK local time during British Summer Time. Runs may also start a few minutes
  # late when GitHub is under load.
  schedule:
    - cron: '0 6 * * 1-5' # 06:00 UTC, Monday to Friday
    - cron: '0 15 * * 1-5' # 15:00 UTC, Monday to Friday

jobs:
  # Mirrors the "ecr-publish-image / Publish image" job from deploy-uat-preview.yml,
  # scanning the built container image (OS packages plus bundled jars). publish is
  # 'false' so the image is built and scanned but never pushed to ECR.
  image-scan:
    name: Container image Snyk scan
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      jar_subproject: 'claims-data:service'
      image_version: ${{ format('{0}-snyk-cron-{1}', vars.LAA_DATA_CLAIMS_API_IMAGE_PREFIX, github.sha) }}
      java_version: '25'
      java_distribution: 'corretto'
      image_scan: 'true'
      publish: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_repository: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_DATA_CLAIMS_API_ECR_ROLE_TO_ASSUME }}
      snyk_token: ${{ secrets.SNYK_TOKEN }}

  slack-notify:
    name: Notify Slack via webhook
    needs: image-scan
    if: ${{ always() && needs.image-scan.result == 'failure' }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Snyk container image scan for laa-data-claims-api failed or found vulnerabilities requiring review",
              "attachments": [
                {
                  "color": "#d63384",
                  "text": "Container image scan: ${{ needs.image-scan.result }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }