name: Security Snyk dependency check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5' # every day at 6 AM, Monday to Friday
    - cron: '0 15 * * 1-5' # every day at 3 PM, Monday to Friday

jobs:
  security-snyk-check:
    name: Project security Snyk dependency check
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/snyk-vulnerability-scan.yml@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
    permissions:
      contents: read
    with:
      java_version: '25'
      java_distribution: 'corretto'
      snyk_organisation: 'legal-aid-agency'
      snyk_test_exclude: ''
      snyk_target_reference: ''
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      snyk_token: ${{ secrets.SNYK_TOKEN }}

  slack-notify:
    name: Notify Slack via webhook
    needs: security-snyk-check
    if: ${{ always() && needs.security-snyk-check.result == 'failure' }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Snyk dependency scan for laa-data-claims-api failed or found vulnerabilities requiring review",
              "attachments": [
                {
                  "color": "#d63384",
                  "text": "Workflow status: ${{ needs.security-snyk-check.result }}\nSeverity focus: HIGH and CRITICAL\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }