name: Security Snyk container image check

on:
  workflow_dispatch:
  # GitHub Actions cron schedules always run in UTC, which is one hour behind
  # UK local time during British Summer Time. Runs may also start a few minutes
  # late when GitHub is under load.
  schedule:
    - cron: '0 6 * * 1-5' # 06:00 UTC, Monday to Friday
    - cron: '0 15 * * 1-5' # 15:00 UTC, Monday to Friday

jobs:
  image-scan:
    name: Container image Snyk scan
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@57f8d08c0cf807ea64fc121500669c4d3dada733 # v2.5.1
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    with:
      jar_subproject: 'claims-data:service'
      image_version: ${{ format('{0}-snyk-cron-{1}', vars.LAA_DATA_CLAIMS_API_IMAGE_PREFIX, github.sha) }}
      java_version: '25'
      java_distribution: corretto
      image_scan: 'true'
      publish: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      gh_packages_token: ${{ secrets.GH_PACKAGES_TOKEN }}
      ecr_repository: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_DATA_CLAIMS_API_ECR_ROLE_TO_ASSUME }}
      snyk_client_id: ${{ secrets.SNYK_CLIENT_ID }}
      snyk_client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

  vulnerability-report:
    name: Generate Snyk vulnerability report
    needs: image-scan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: read
    steps:
      - name: Checkout snyk-report action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/snyk-report
          persist-credentials: false

      - name: Generate Snyk vulnerability report
        uses: ./.github/actions/snyk-report
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          image_scan_result: ${{ needs.image-scan.result }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
