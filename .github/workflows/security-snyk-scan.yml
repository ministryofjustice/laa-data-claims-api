name: Security Snyk container image scan and Slack notification

on:
  workflow_call:
    inputs:
      image_prefix:
        description: Prefix used when naming the temporary image
        required: true
        type: string
      jar_subproject:
        description: Required Gradle subproject containing the service JAR to scan
        required: true
        type: string
      java_version:
        description: Java version used to build the service image
        required: false
        default: '25'
        type: string
      java_distribution:
        description: JDK distribution used to build the service image
        required: false
        default: corretto
        type: string
    secrets:
      gh_token:
        description: Required GitHub token used by the image build and scan workflow
        required: true
      gh_packages_token:
        description: "Read-only PAT (read:packages) for resolving GitHub Packages hosted in other repositories."
        required: false
      ecr_repository:
        description: Required ECR repository used for the container image
        required: true
      ecr_region:
        description: Required AWS region containing the ECR repository
        required: true
      ecr_role_to_assume:
        description: Required AWS role assumed to access the ECR repository
        required: true
      snyk_client_id:
        description: Required Snyk client ID used to authenticate the image scan
        required: true
      snyk_client_secret:
        description: Required Snyk client secret used to authenticate the image scan
        required: true
      slack_webhook:
        description: Slack incoming webhook used for scan failure notifications
        required: false

jobs:
  image-scan:
    name: Container image Snyk scan
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@57f8d08c0cf807ea64fc121500669c4d3dada733 # v2.5.1
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    with:
      jar_subproject: ${{ inputs.jar_subproject }}
      image_version: ${{ format('{0}-snyk-cron-{1}', inputs.image_prefix, github.sha) }}
      java_version: ${{ inputs.java_version }}
      java_distribution: ${{ inputs.java_distribution }}
      image_scan: 'true'
      publish: 'false'
    secrets:
      gh_token: ${{ secrets.gh_token }}
      gh_packages_token: ${{ secrets.gh_packages_token }}
      ecr_repository: ${{ secrets.ecr_repository }}
      ecr_region: ${{ secrets.ecr_region }}
      ecr_role_to_assume: ${{ secrets.ecr_role_to_assume }}
      snyk_client_id: ${{ secrets.snyk_client_id }}
      snyk_client_secret: ${{ secrets.snyk_client_secret }}

  vulnerability-report:
    name: Generate Snyk vulnerability report
    needs: image-scan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: read
    env:
      GH_TOKEN: ${{ secrets.gh_token }}
    outputs:
      alert_count: ${{ steps.alerts.outputs.count }}
      slack_text: ${{ steps.slack_summary.outputs.text }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When called from another repo, check out this workflow's own repo and commit (not the caller's)
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          token: ${{ secrets.gh_token }}
          sparse-checkout: scripts/snyk
          persist-credentials: false

      # Code scanning alert ingestion from the Snyk SARIF upload (in the shared
      # ecr-publish-image workflow) is asynchronous. Poll rather than paying a
      # flat delay on every run - exits early once the analysis lands, capped
      # at 60s total.
      - name: Wait for Snyk SARIF processing
        id: sarif
        continue-on-error: true
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: scripts/snyk/wait-for-sarif.sh

      - name: Fetch Snyk code scanning alerts
        id: alerts
        if: ${{ steps.sarif.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          REPO: ${{ github.repository }}
          ANALYSIS_IDS: ${{ steps.sarif.outputs.analysis_ids }}
        run: scripts/snyk/fetch-alerts.sh

      - name: Build vulnerability report
        if: ${{ steps.alerts.outcome == 'success' }}
        env:
          IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
          REF: ${{ github.ref }}
          ALERT_COUNT: ${{ steps.alerts.outputs.count }}
        run: scripts/snyk/build-report.sh

      - name: Upload vulnerability report artifact
        if: ${{ steps.alerts.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snyk-vulnerability-report
          path: |
            snyk-alerts.json
            snyk-report.md
          retention-days: 14

      # Show the three highest-severity alerts in Slack and link to the full
      # GitHub summary. JSON-escape the text for the slack-notify payload.
      - name: Build Slack summary
        id: slack_summary
        env:
          IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
          ALERT_COUNT: ${{ steps.alerts.outputs.count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERTS_OUTCOME: ${{ steps.alerts.outcome }}
        run: scripts/snyk/build-slack-summary.sh

  slack-notify:
    name: Notify Slack via webhook
    needs: [image-scan, vulnerability-report]
    if: ${{ always() && needs.image-scan.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook }}
    steps:
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Snyk container image scan for ${{ github.repository }} failed or found vulnerabilities requiring review",
              "attachments": [
                {
                  "color": "#d63384",
                  "text": ${{ needs.vulnerability-report.outputs.slack_text || '"Vulnerability details unavailable - see workflow run"' }}
                }
              ]
            }
