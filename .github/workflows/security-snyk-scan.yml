name: Security Snyk container image scan and Slack notification

on:
  workflow_call:
    inputs:
      image_prefix:
        description: Prefix used when naming the temporary image
        required: true
        type: string
    secrets:
      gh_token:
        description: GitHub token used by the image build and scan workflow
        required: true
      ecr_repository:
        description: ECR repository used for the container image
        required: true
      ecr_region:
        description: AWS region containing the ECR repository
        required: true
      ecr_role_to_assume:
        description: AWS role assumed to access the ECR repository
        required: true
      snyk_client_id:
        description: Snyk client ID used to authenticate the image scan
        required: true
      snyk_client_secret:
        description: Snyk client secret used to authenticate the image scan
        required: true
      slack_webhook:
        description: Slack incoming webhook used for scan failure notifications
        required: false

env:
  JAVA_VERSION: &JAVA_VERSION '25'
  JDK_DISTRIBUTION: &JDK_DISTRIBUTION 'corretto'

jobs:
  image-scan:
    name: Container image Snyk scan
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      jar_subproject: 'claims-data:service'
      image_version: ${{ format('{0}-snyk-cron-{1}', inputs.image_prefix, github.sha) }}
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
      image_scan: 'true'
      publish: 'false'
    secrets:
      gh_token: ${{ secrets.gh_token }}
      ecr_repository: ${{ secrets.ecr_repository }}
      ecr_region: ${{ secrets.ecr_region }}
      ecr_role_to_assume: ${{ secrets.ecr_role_to_assume }}
      snyk_client_id: ${{ secrets.snyk_client_id }}
      snyk_client_secret: ${{ secrets.snyk_client_secret }}

  vulnerability-report:
    name: Generate Snyk vulnerability report
    needs: image-scan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    env:
      GH_TOKEN: ${{ secrets.gh_token }}
    outputs:
      alert_count: ${{ steps.alerts.outputs.count }}
      slack_text: ${{ steps.slack_summary.outputs.text }}
    steps:
      # Code scanning alert ingestion from the Snyk SARIF upload (in the shared
      # ecr-publish-image workflow) is asynchronous. Poll rather than paying a
      # flat delay on every run - exits early once the analysis lands, capped
      # at 60s total.
      - name: Wait for Snyk SARIF processing
        continue-on-error: true
        run: |
          max_attempts=6
          delay=10
          for i in $(seq 1 "$max_attempts"); do
            found=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/code-scanning/analyses?ref=${{ github.ref }}&tool_name=Snyk+Container" \
              --jq ".[] | select(.commit_sha == \"${{ github.sha }}\") | .id" | wc -l)
            if [ "$found" -gt 0 ]; then
              echo "SARIF analysis found on attempt $i"
              exit 0
            fi
            echo "Attempt $i/$max_attempts: analysis not yet available, waiting ${delay}s"
            sleep "$delay"
          done
          echo "::warning::Snyk SARIF analysis not found after $((max_attempts * delay))s; report may be incomplete"

      - name: Fetch Snyk code scanning alerts
        id: alerts
        continue-on-error: true
        run: |
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/code-scanning/alerts?tool_name=Snyk+Container&state=open&ref=${{ github.ref }}" \
            > snyk-alerts.json
          echo "count=$(jq 'length' snyk-alerts.json)" >> "$GITHUB_OUTPUT"

      - name: Build vulnerability report
        if: ${{ steps.alerts.outcome == 'success' }}
        run: |
          {
            echo "# Snyk container image vulnerability report"
            echo
            echo "Image scan result: \`${{ needs.image-scan.result }}\`"
            echo
            echo "Found **${{ steps.alerts.outputs.count }}** open code scanning alert(s) for \`${{ github.ref }}\`."
            echo
            echo "| Severity | Rule | Location | Links |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.rule.security_severity_level // "unknown") | \(.rule.description // .rule.id) | \(.most_recent_instance.location.path // "n/a"):\(.most_recent_instance.location.start_line // "n/a") | [GitHub](\(.html_url)) / [Snyk](https://security.snyk.io/vuln/\(.rule.id)) |"' snyk-alerts.json
          } > snyk-report.md
          cat snyk-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload vulnerability report artifact
        if: ${{ steps.alerts.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snyk-vulnerability-report
          path: |
            snyk-alerts.json
            snyk-report.md
          retention-days: 14

      # Build a Slack-friendly plain-text summary (JSON-pre-escaped, including
      # surrounding quotes) so it can be dropped straight into the Slack
      # payload JSON in the slack-notify job without breaking it on newlines.
      - name: Build Slack summary
        id: slack_summary
        run: |
          {
            echo "*Container image scan:* ${{ needs.image-scan.result }}"
            echo "*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            echo
            if [ "${{ steps.alerts.outcome }}" = "success" ]; then
              echo "*Open alerts: ${{ steps.alerts.outputs.count }}*"
              echo
              jq -r '.[] |
                (.rule.security_severity_level // "unknown" | ascii_upcase) as $sev |
                (.rule.description // .rule.id | sub("^(Low|Medium|High|Critical) severity - "; "")) as $desc |
                "• *[\($sev)]* \($desc)\n   <\(.html_url)|GitHub> · <https://security.snyk.io/vuln/\(.rule.id)|Snyk>"
              ' snyk-alerts.json
            else
              echo "Vulnerability details unavailable - see job summary/artifact"
            fi
          } > slack-summary.txt
          echo "text=$(jq -Rs . slack-summary.txt)" >> "$GITHUB_OUTPUT"

  slack-notify:
    name: Notify Slack via webhook
    needs: [image-scan, vulnerability-report]
    if: ${{ always() && needs.image-scan.result == 'failure' }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook }}
    steps:
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Snyk container image scan for laa-data-claims-api failed or found vulnerabilities requiring review",
              "attachments": [
                {
                  "color": "#d63384",
                  "text": ${{ needs.vulnerability-report.outputs.slack_text }}
                }
              ]
            }

