name: Deploy main

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        required: true
        default: "patch"
        description: "Release type"
        options: [ "patch", "minor", "major" ]

env:
  JAVA_VERSION: &JAVA_VERSION '25'
  JDK_DISTRIBUTION: &JDK_DISTRIBUTION 'corretto'

jobs:
  release:
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/gradle-build-and-publish.yml@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
    permissions:
      contents: write
      packages: write
    with:
      build_command: 'assemble'
      junit_results: 'false'
      junit_report: 'false'
      checkstyle_report: 'false'
      jacoco_coverage_report: 'false'
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
      release_type: ${{ inputs.release_type != 'auto' && inputs.release_type || '' }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      aws_region: ${{ vars.AWS_REGION }}

  pact-test:
    needs: [ release ]
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/pact-and-publish.yml@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
    permissions:
      contents: write
      packages: write
    with:
      pact_test_task: ":claims-data:service:pactTest"
      pacticipant_name: 'laa-data-claims-api'
      is_provider: true
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      pact_broker_url: ${{ secrets.PACT_BROKER_URL }}
      pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
      pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}

  bdd-test:
    runs-on: ubuntu-latest
    needs: [ release ]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run BDD test suite
        uses: ./.github/actions/bdd-test
        with:
          java-version: *JAVA_VERSION
          java-distribution: *JDK_DISTRIBUTION

  ecr-publish-image:
    needs: [ release, bdd-test ]
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
      jar_subproject: 'claims-data:service'
      image_version: ${{ format('{0}-{1}', vars.LAA_DATA_CLAIMS_API_IMAGE_PREFIX, needs.release.outputs.published_artifact_version) }}
      image_scan: 'true'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_repository: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_DATA_CLAIMS_API_ECR_ROLE_TO_ASSUME }}
      snyk_token: ${{ secrets.SNYK_TOKEN }}

  deploy-uat:
    runs-on: ubuntu-latest
    needs:
      - release
      - ecr-publish-image
      - pact-test
    environment: uat
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get currently deployed ref
        id: uat_deployed
        # Non-blocking: this only feeds the post-deploy Slack notification, it
        # must never prevent the actual deployment below from running.
        continue-on-error: true
        uses: ./.github/actions/get_deployed_git_ref
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          deployment: main-data-claims-api
          image-prefix: ${{ vars.LAA_DATA_CLAIMS_API_IMAGE_PREFIX }}

      - name: Can I deploy UAT?
        id: can_i_deploy_uat
        uses: ministryofjustice/laa-ccms-common-workflows/.github/actions/pact-can-i-deploy@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
        with:
          pacticipant: 'laa-data-claims-api'
          environment: 'main'
          pact_broker_url: ${{ secrets.PACT_BROKER_URL }}
          pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
          pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}

      - name: Deploy UAT
        id: deploy_uat
        uses: ./.github/actions/deploy_branch
        with:
          ecr-region: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.LAA_DATA_CLAIMS_API_ECR_ROLE_TO_ASSUME }}
          ecr-repository: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          app-environment: uat
          image-tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}

      # Runs only once "Deploy UAT" above has succeeded, using the ref
      # captured before deployment as the "from" side of the diff. Never
      # blocks the pipeline - this is a nicety, not a deployment requirement.
      - name: Notify Slack of UAT update
        continue-on-error: true
        uses: ./.github/actions/release_diff_notify
        with:
          from-ref: ${{ steps.uat_deployed.outputs.git-ref }}
          to-ref: ${{ github.sha }}
          environment-name: UAT
          to-label: "v${{ needs.release.outputs.published_artifact_version }}"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Record UAT deployment to pact broker
        id: record_uat_deployment
        uses: ministryofjustice/laa-ccms-common-workflows/.github/actions/pact-record-deployment@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
        with:
          pacticipant: 'laa-data-claims-api'
          environment: 'main'
          pact_broker_url: ${{ secrets.PACT_BROKER_URL }}
          pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
          pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs:
      - release
      - ecr-publish-image
      - pact-test
      - deploy-uat
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get currently deployed ref
        id: staging_deployed
        # Non-blocking: this only feeds the post-deploy Slack notification, it
        # must never prevent the actual deployment below from running.
        continue-on-error: true
        uses: ./.github/actions/get_deployed_git_ref
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          deployment: laa-data-claims-api
          image-prefix: ${{ vars.LAA_DATA_CLAIMS_API_IMAGE_PREFIX }}

      - name: Can I deploy Staging?
        id: can_i_deploy_staging
        uses: ministryofjustice/laa-ccms-common-workflows/.github/actions/pact-can-i-deploy@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
        with:
          pacticipant: 'laa-data-claims-api'
          environment: 'main'
          pact_broker_url: ${{ secrets.PACT_BROKER_URL }}
          pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
          pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}

      - name: Deploy staging
        id: deploy_staging
        uses: ./.github/actions/deploy
        with:
          ecr-region: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.LAA_DATA_CLAIMS_API_ECR_ROLE_TO_ASSUME }}
          ecr-repository: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          app-environment: staging
          image-tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}

      # Runs only once "Deploy staging" above has succeeded, using the ref
      # captured before deployment as the "from" side of the diff. Never
      # blocks the pipeline - this is a nicety, not a deployment requirement.
      - name: Notify Slack of Staging update
        continue-on-error: true
        uses: ./.github/actions/release_diff_notify
        with:
          from-ref: ${{ steps.staging_deployed.outputs.git-ref }}
          to-ref: ${{ github.sha }}
          environment-name: Staging
          to-label: "v${{ needs.release.outputs.published_artifact_version }}"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Record staging deployment to pact broker
        id: record_staging_deployment
        uses: ministryofjustice/laa-ccms-common-workflows/.github/actions/pact-record-deployment@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
        with:
          pacticipant: 'laa-data-claims-api'
          environment: 'main'
          pact_broker_url: ${{ secrets.PACT_BROKER_URL }}
          pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
          pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}

  deploy-production:
    runs-on: ubuntu-latest
    needs:
      - release
      - ecr-publish-image
      - pact-test
      - deploy-staging
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get currently deployed ref
        id: production_deployed
        # Non-blocking: this only feeds the post-deploy Slack notification, it
        # must never prevent the actual deployment below from running.
        continue-on-error: true
        uses: ./.github/actions/get_deployed_git_ref
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          deployment: laa-data-claims-api
          image-prefix: ${{ vars.LAA_DATA_CLAIMS_API_IMAGE_PREFIX }}

      - name: Can I deploy Production?
        id: can_i_deploy_production
        uses: ministryofjustice/laa-ccms-common-workflows/.github/actions/pact-can-i-deploy@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
        with:
          pacticipant: 'laa-data-claims-api'
          environment: 'main'
          pact_broker_url: ${{ secrets.PACT_BROKER_URL }}
          pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
          pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}

      - name: Deploy production
        id: deploy_production
        uses: ./.github/actions/deploy
        with:
          ecr-region: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.LAA_DATA_CLAIMS_API_ECR_ROLE_TO_ASSUME }}
          ecr-repository: ${{ vars.LAA_DATA_CLAIMS_API_ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          app-environment: production
          image-tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}

      # Runs only once "Deploy production" above has succeeded, using the ref
      # captured before deployment as the "from" side of the diff. Never
      # blocks the pipeline - this is a nicety, not a deployment requirement.
      - name: Notify Slack of Production update
        continue-on-error: true
        uses: ./.github/actions/release_diff_notify
        with:
          from-ref: ${{ steps.production_deployed.outputs.git-ref }}
          to-ref: ${{ github.sha }}
          environment-name: Production
          to-label: "v${{ needs.release.outputs.published_artifact_version }}"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Record production deployment to pact broker
        id: record_production_deployment
        uses: ministryofjustice/laa-ccms-common-workflows/.github/actions/pact-record-deployment@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
        with:
          pacticipant: 'laa-data-claims-api'
          environment: 'main'
          pact_broker_url: ${{ secrets.PACT_BROKER_URL }}
          pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
          pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}
